spring.application.name=plant-disease-backend
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/plantdisease}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:plantdisease}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:plantdisease}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
app.ai-service-url=${AI_SERVICE_URL:http://localhost:8000}
app.upload-dir=${UPLOAD_DIR:uploads}
