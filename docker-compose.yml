services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plantdisease
      POSTGRES_USER: plantdisease
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantdisease}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantdisease -d plantdisease"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-service:
    build: ./ai-service
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/plantdisease
      SPRING_DATASOURCE_USERNAME: plantdisease
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-plantdisease}
      AI_SERVICE_URL: http://ai-service:8000
      UPLOAD_DIR: /app/uploads
    volumes:
      - diagnosis-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  diagnosis-uploads:
